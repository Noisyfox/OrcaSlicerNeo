# Starter FDM config for the slice spike. This is a MINIMAL starting point, not
# a complete profile — a real slice needs a full config. Export one from
# OrcaSlicer (File > Export > Export Config) and point run-slice.mjs at it.
layer_height = 0.2
first_layer_height = 0.2
nozzle_diameter = 0.4
filament_diameter = 1.75
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
bed_shape = 0x0,220x0,220x220,0x220
perimeters = 2
top_solid_layers = 3
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
perimeter_speed = 60
infill_speed = 80
travel_speed = 150
gcode_flavor = marlin
start_gcode = G28\nG1 Z5 F5000
end_gcode = M104 S0\nM140 S0\nG28 X0\nM84
