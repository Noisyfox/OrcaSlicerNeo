packages:
  - "apps/*"
  - "packages/*"

# pnpm >= 10.x persists/reads `allowBuilds`; older pnpm 10.1.x used
# `onlyBuiltDependencies` (below). Keep BOTH in sync.
# NOTE: electron@43.4.0 has NO postinstall script (binary download is
# `node install.js`, only exposed as the `install-electron` bin). pnpm will
# never run it, whitelist or not. If electron-vite dev dies with
# "Error: Electron uninstall", the binary is missing from the store entry
# (e.g. after a peer re-resolution prunes it) — restore with
# `cd apps/desktop/node_modules/electron && node install.js`.
allowBuilds:
  '@swc/core': true
  electron: true
  electron-winstaller: true
  esbuild: true

# pnpm 10 blocks dependency postinstall scripts by default; electron (binary
# download), esbuild, and electron-winstaller need theirs allowed.
# NOTE: pnpm 10.0.0 ignores this file entirely (both package.json and
# pnpm-workspace.yaml locations) — pinned pnpm must be >= 10.1 (see package.json).
onlyBuiltDependencies:
  - electron
  - esbuild
  - electron-winstaller
  - '@swc/core'
