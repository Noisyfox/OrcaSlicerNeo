# .github/workflows/ci.yml — M3 CI matrix (Grand Plan M3, high-level plan Epic 3.2).
#
# Jobs:
#   wasm       build threaded and serial wasm64 artifacts with emsdk 6.0.4;
#              retain the existing threaded artifact for desktop consumers.
#   unit       vitest + typecheck + electron-vite build (all packages)
#   e2e-mock   Playwright full v1 flow against the mock-built app (no emsdk)
#   e2e-real   Playwright full v1 flow against the REAL module (staged artifact)
#   package    electron-builder matrix → all six targets, same wasm artifact
#   pages-build/pages-deploy  reuse the WASM job on main pushes for GitHub Pages
#
# WASM build notes (AGENTS.md "WASM Build Workflow"): missing <tbb/X.h> →
# add to TBB_HEADERS; undefined symbol → DROP_PATTERNS or stubs; API drift →
# bridge signatures. First runs will iterate; fixes land in this repo and CI
# re-runs. The dependency cache is saved before core compilation so a core
# failure cannot discard a completed dependency build.
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be >= 24: emsdk 6.0.4's MEMORY64 glue hard-requires node v24.0.0
  # (table64 binaries fail to instantiate on older V8 — "invalid table
  # elements limits flags"). Volta-pinned in root package.json.
  NODE_VERSION: "24.19.0"

jobs:
  profile-pack:
    name: Profile packages (independent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test deterministic profile pack layout
        run: pnpm --filter @orca/profile-resources test
      - name: Build profile packages (no WASM dependency)
        run: pnpm --filter @orca/profile-resources build
      - uses: actions/upload-artifact@v7
        with:
          name: profile-packages
          path: packages/profile-resources/dist
          if-no-files-found: error
          retention-days: 7

  wasm:
    name: WASM build + smoke
    needs: profile-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # version header reads `git describe` on the submodule
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: profile-packages
          path: packages/profile-resources/dist
      - uses: emscripten-core/setup-emsdk@v15 # official action; jaxvanyang/setup-emsdk repo no longer resolves
        with:
          version: "6.0.4" # spike-validated (design doc risk table); emsdk tag verified to exist
      - name: Select compiled dependency cache key
        id: dependency-key
        env:
          DEPS_INPUT_HASH: ${{ hashFiles('packages/slicer-wasm/fetch-deps.sh', 'packages/slicer-wasm/build-boost-wasm64.sh', 'packages/slicer-wasm/fetch-onetbb.sh', 'packages/slicer-wasm/build-onetbb.sh', 'packages/slicer-wasm/build-draco-wasm64.sh', 'packages/slicer-wasm/build-occt-wasm64.sh', 'packages/slicer-wasm/patches/occt/*.patch', 'packages/slicer-wasm/stubs/freetype-port-probe.c') }}
        run: echo "key=${{ runner.os }}-wasm64-deps-emsdk-6.0.4-${DEPS_INPUT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore compiled WASM dependencies
        id: dependency-cache
        uses: actions/cache/restore@v6
        with:
          path: packages/slicer-wasm/.work/deps
          key: ${{ steps.dependency-key.outputs.key }}
      - name: Fetch deps (Eigen/Boost/cereal)
        run: bash packages/slicer-wasm/fetch-deps.sh
      - name: Compile dependencies for both WASM variants
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: |
          bash packages/slicer-wasm/build-boost-wasm64.sh
          bash packages/slicer-wasm/build-onetbb.sh
          node packages/slicer-wasm/harness/run-tbb-parallelism-probe.mjs packages/slicer-wasm/out/orca_tbb_probe.js
          WASM_THREADING=1 WASM_ARTIFACT_VARIANT=threaded bash packages/slicer-wasm/build-draco-wasm64.sh
          WASM_THREADING=0 WASM_ARTIFACT_VARIANT=serial bash packages/slicer-wasm/build-draco-wasm64.sh
          WASM_THREADING=1 WASM_ARTIFACT_VARIANT=threaded bash packages/slicer-wasm/build-occt-wasm64.sh
          WASM_THREADING=0 WASM_ARTIFACT_VARIANT=serial bash packages/slicer-wasm/build-occt-wasm64.sh
      - name: Verify staged WASM dependencies
        run: |
          deps=packages/slicer-wasm/.work/deps
          test -f "$deps/boost-1.84.0/boost/version.hpp"
          test -f "$deps/boost-1.84.0/stage-wasm64/lib/libboost_filesystem-clang-mt-s-1_84.a"
          test -f "$deps/oneTBB-3cdc6f6558ba23ec9ceed92078b49dc664ed5bf3/stage-wasm64-pthreads/lib/libtbb.a"
          for variant in threaded serial; do
            test -f "$deps/draco-1.5.7/stage-wasm64-$variant/lib/libdraco.a"
            test -f "$deps/occt-7.6.0/stage-wasm64-$variant/include/opencascade/Standard.hxx"
            test -f "$deps/occt-7.6.0/stage-wasm64-$variant/lib/libTKXDESTEP.a"
          done
      - name: Save compiled WASM dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: packages/slicer-wasm/.work/deps
          key: ${{ steps.dependency-key.outputs.key }}
      - name: Configure + build the module (preload-file bundle included)
        run: bash packages/slicer-wasm/build.sh
      - name: Smoke — slice cube.stl end to end
        run: node packages/slicer-wasm/harness/run-slice.mjs --module packages/slicer-wasm/out/orca_slice.js --stl packages/slicer-wasm/fixtures/cube.stl --config packages/slicer-wasm/fixtures/config.json
      - name: Bridge smoke — binary-buffer contract (M2 deferred verification)
        run: node packages/slicer-wasm/harness/bridge-smoke.mjs packages/slicer-wasm/out/orca_slice.js packages/slicer-wasm/fixtures/cube.stl
      - name: Build serial WASM for the Web fallback
        run: WASM_THREADING=0 WASM_ARTIFACT_VARIANT=serial bash packages/slicer-wasm/build.sh
      - name: Smoke — serial fallback slices cube.stl
        run: node packages/slicer-wasm/harness/run-slice.mjs --module packages/slicer-wasm/out/serial/orca_slice.js --stl packages/slicer-wasm/fixtures/cube.stl --config packages/slicer-wasm/fixtures/config.json
      - name: Upload the one module (all six packages + e2e-real use it)
        uses: actions/upload-artifact@v7
        with:
          name: orca-slice
          path: |
            packages/slicer-wasm/out/orca_slice.js
            packages/slicer-wasm/out/orca_slice.wasm
            packages/slicer-wasm/out/orca_slice.data
          retention-days: 7
      - name: Upload both Web WASM variants
        uses: actions/upload-artifact@v7
        with:
          name: orca-slice-web
          path: |
            packages/slicer-wasm/out/threaded/orca_slice.js
            packages/slicer-wasm/out/threaded/orca_slice.wasm
            packages/slicer-wasm/out/threaded/orca_slice.data
            packages/slicer-wasm/out/serial/orca_slice.js
            packages/slicer-wasm/out/serial/orca_slice.wasm
            packages/slicer-wasm/out/serial/orca_slice.data
          if-no-files-found: error
          retention-days: 7

  unit:
    name: Unit + typecheck + app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # installs pnpm@10.0.0 from root packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - run: pnpm -r typecheck
      - run: pnpm --filter @orca/desktop build

  e2e-mock:
    name: e2e (mock module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # installs pnpm@10.0.0 from root packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: e2e — full v1 flow (mock-built app)
        run: xvfb-run -a pnpm --filter @orca/desktop test:e2e

  e2e-real:
    name: e2e (real module)
    needs: wasm
    runs-on: ubuntu-latest
    env:
      ORCA_E2E_REAL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # installs pnpm@10.0.0 from root packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: orca-slice
          path: packages/slicer-wasm/out
      - run: node scripts/stage-wasm.mjs
      - name: e2e — full v1 flow (real module, asserts G1 moves in exported gcode)
        run: xvfb-run -a pnpm --filter @orca/desktop test:e2e:real

  pages-build:
    name: Build Web Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: orca-slice-web
          path: packages/slicer-wasm/out
      - uses: actions/download-artifact@v8
        with:
          name: profile-packages
          path: packages/profile-resources/dist
      - uses: actions/configure-pages@v5
      - name: Verify Web host
        run: |
          pnpm --filter @orca/web test
          pnpm --filter @orca/web typecheck
      - name: Build static Web app
        run: pnpm --filter @orca/web build
      - name: Verify subpath deployment
        run: node apps/web/scripts/non-root-smoke.mjs
      - name: Prepare Pages artifact
        run: node scripts/prepare-web-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  pages-deploy:
    name: Deploy Web Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  package:
    name: Package (${{ matrix.name }})
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win x64 + arm64 (NSIS)
            os: windows-latest
            args: --win
          - name: linux x64 + arm64 (AppImage)
            os: ubuntu-latest
            args: --linux
          - name: mac x64 (DMG)
            os: macos-14 # macos-13 runners retired (2026); electron-builder downloads the x64 Electron dist
            args: --mac --x64
          - name: mac arm64 (DMG)
            os: macos-14
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # installs pnpm@10.0.0 from root packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: orca-slice
          path: packages/slicer-wasm/out
      - run: node scripts/stage-wasm.mjs
      - name: electron-builder (${{ matrix.name }})
        run: pnpm --filter @orca/desktop package -- ${{ matrix.args }}
      - name: Upload installer(s)
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14
