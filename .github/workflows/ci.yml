# .github/workflows/ci.yml — M3 CI matrix (Grand Plan M3, high-level plan Epic 3.2).
#
# Jobs:
#   wasm_deps  cache compiled dependencies for both wasm64 variants.
#   wasm_threaded / wasm_serial  reuse tested production artifacts on an exact
#              cache hit; otherwise compile and smoke-test on separate runners;
#              retain the existing threaded artifact for external consumers.
#   unit       vitest + typecheck (independent of generated WASM artifacts)
#   e2e-mock   Playwright full v1 flow against the mock-built app (no emsdk)
#   e2e-real   Playwright full v1 flow against the REAL module (staged artifacts)
#   package    electron-builder matrix → all six targets, same WASM artifacts
#   pages-build  verify the Web artifact on PRs and main pushes;
#   pages-deploy  publish the verified artifact only on main pushes
#
# WASM build notes (AGENTS.md "WASM Build Workflow"): missing <tbb/X.h> →
# add to TBB_HEADERS; undefined symbol → DROP_PATTERNS or stubs; API drift →
# bridge signatures. First runs will iterate; fixes land in this repo and CI
# re-runs. The dependency cache is saved before core compilation so a core
# failure cannot discard a completed dependency build.
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be >= 24: emsdk 6.0.4's MEMORY64 glue hard-requires node v24.0.0
  # (table64 binaries fail to instantiate on older V8 — "invalid table
  # elements limits flags"). Volta-pinned in root package.json.
  NODE_VERSION: "24.19.0"
  EMSDK_VERSION: "6.0.4"

jobs:
  profile-pack:
    name: Profile packages (independent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test deterministic profile pack layout
        run: pnpm --filter @orca/profile-resources test
      - name: Build profile packages (no WASM dependency)
        run: pnpm --filter @orca/profile-resources build
      - uses: actions/upload-artifact@v7
        with:
          name: profile-packages
          path: packages/profile-resources/dist
          if-no-files-found: error
          retention-days: 7

  wasm_deps:
    name: WASM dependencies
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.dependency-key.outputs.key }}
      build_cache_key: ${{ steps.build-key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: emscripten-core/setup-emsdk@v15 # official action; jaxvanyang/setup-emsdk repo no longer resolves
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Select compiled dependency cache key
        id: dependency-key
        env:
          DEPS_INPUT_HASH: ${{ hashFiles('packages/slicer-wasm/fetch-deps.sh', 'packages/slicer-wasm/build-boost-wasm64.sh', 'packages/slicer-wasm/fetch-onetbb.sh', 'packages/slicer-wasm/build-onetbb.sh', 'packages/slicer-wasm/build-draco-wasm64.sh', 'packages/slicer-wasm/build-nlopt-wasm64.sh', 'packages/slicer-wasm/build-occt-wasm64.sh', 'packages/slicer-wasm/patches/occt/*.patch', 'packages/slicer-wasm/stubs/freetype-port-probe.c') }}
        run: echo "key=${{ runner.os }}-wasm64-deps-emsdk-${EMSDK_VERSION}-${DEPS_INPUT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Select tested WASM artifact cache key
        id: build-key
        env:
          # Hash native build inputs only; tests, fixtures, JS dependencies and
          # workflow test steps do not invalidate production artifacts. The
          # submodule is identified by its recorded gitlink, never file hashes.
          WASM_INPUT_HASH: ${{ hashFiles('packages/slicer-wasm/*.sh', 'packages/slicer-wasm/CMakeLists.txt', 'packages/slicer-wasm/src/**/*.cpp', 'packages/slicer-wasm/src/**/*.hpp', 'packages/slicer-wasm/src/**/*.h', 'packages/slicer-wasm/shim/**/*.hpp', 'packages/slicer-wasm/shim/**/*.h', 'packages/slicer-wasm/stubs/*.cpp', 'packages/slicer-wasm/stubs/freetype-port-probe.c', 'packages/slicer-wasm/patches/**', '!packages/slicer-wasm/src/**/*.test.*') }}
        run: |
          orca_pin=$(git rev-parse HEAD:packages/slicer-wasm/cpp)
          echo "key=${{ runner.os }}-${{ runner.arch }}-wasm64-tested-v2-emsdk-${EMSDK_VERSION}-${orca_pin}-${WASM_INPUT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore compiled WASM dependencies
        id: dependency-cache
        uses: actions/cache/restore@v6
        with:
          path: packages/slicer-wasm/.work/deps
          key: ${{ steps.dependency-key.outputs.key }}
      - name: Fetch deps (Eigen/Boost/cereal)
        run: bash packages/slicer-wasm/fetch-deps.sh
      - name: Compile dependencies for both WASM variants
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: |
          bash packages/slicer-wasm/build-boost-wasm64.sh
          bash packages/slicer-wasm/build-onetbb.sh
          node packages/slicer-wasm/harness/run-tbb-parallelism-probe.mjs packages/slicer-wasm/out/orca_tbb_probe.js
          WASM_THREADING=1 WASM_ARTIFACT_VARIANT=threaded bash packages/slicer-wasm/build-nlopt-wasm64.sh
          WASM_THREADING=0 WASM_ARTIFACT_VARIANT=serial bash packages/slicer-wasm/build-nlopt-wasm64.sh
          WASM_THREADING=1 WASM_ARTIFACT_VARIANT=threaded bash packages/slicer-wasm/build-draco-wasm64.sh
          WASM_THREADING=0 WASM_ARTIFACT_VARIANT=serial bash packages/slicer-wasm/build-draco-wasm64.sh
          WASM_THREADING=1 WASM_ARTIFACT_VARIANT=threaded bash packages/slicer-wasm/build-occt-wasm64.sh
          WASM_THREADING=0 WASM_ARTIFACT_VARIANT=serial bash packages/slicer-wasm/build-occt-wasm64.sh
      - name: Verify staged WASM dependencies
        run: |
          deps=packages/slicer-wasm/.work/deps
          require_file() {
            test -f "$1" || { echo "::error::Missing compiled WASM dependency: $1"; exit 1; }
          }
          require_file "$deps/boost-1.84.0/boost/version.hpp"
          boost_filesystem=("$deps/boost-1.84.0/stage-wasm64/lib"/libboost_filesystem*.a)
          require_file "${boost_filesystem[0]}"
          require_file "$deps/oneTBB-3cdc6f6558ba23ec9ceed92078b49dc664ed5bf3/stage-wasm64-pthreads/lib/libtbb.a"
          for variant in threaded serial; do
            require_file "$deps/nlopt-2.5.0/stage-wasm64-$variant/include/nlopt.h"
            require_file "$deps/nlopt-2.5.0/stage-wasm64-$variant/include/nlopt.hpp"
            require_file "$deps/nlopt-2.5.0/stage-wasm64-$variant/lib/libnlopt.a"
            require_file "$deps/draco-1.5.7/stage-wasm64-$variant/lib/libdraco.a"
            require_file "$deps/occt-7.6.0/stage-wasm64-$variant/include/opencascade/Standard.hxx"
            require_file "$deps/occt-7.6.0/stage-wasm64-$variant/lib/libTKXDESTEP.a"
          done
      - name: Save compiled WASM dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: packages/slicer-wasm/.work/deps
          key: ${{ steps.dependency-key.outputs.key }}

  wasm_threaded:
    name: WASM threaded build + smoke
    needs: [wasm_deps, profile-pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # version header reads `git describe` on the submodule
      - name: Restore tested threaded WASM artifacts
        id: wasm-cache
        uses: actions/cache/restore@v6
        with:
          path: packages/slicer-wasm/out/threaded
          key: ${{ needs.wasm_deps.outputs.build_cache_key }}-threaded
      - uses: actions/setup-node@v7
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          name: profile-packages
          path: packages/profile-resources/dist
      - uses: emscripten-core/setup-emsdk@v15
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Restore compiled WASM dependencies
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        id: dependency-cache
        uses: actions/cache/restore@v6
        with:
          path: packages/slicer-wasm/.work/deps
          key: ${{ needs.wasm_deps.outputs.cache_key }}
      - name: Require the compiled dependency cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: test "${{ steps.dependency-cache.outputs.cache-hit }}" = "true"
      - name: Refresh generated dependency headers
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: bash packages/slicer-wasm/fetch-deps.sh
      - name: Configure + build threaded module (preload-file bundle included)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: bash packages/slicer-wasm/build.sh
      - name: Verify arrangement with cached threaded NLopt
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          cmake --build packages/slicer-wasm/.work/threaded/build --target arrangement_core_test headless_arrangement_test --parallel 2
          node packages/slicer-wasm/.work/threaded/build/arrangement_core_test.cjs
          node packages/slicer-wasm/.work/threaded/build/headless_arrangement_test.cjs
      - name: Smoke — slice cube.stl end to end
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: node packages/slicer-wasm/harness/run-slice.mjs --module packages/slicer-wasm/out/orca_slice.js --stl packages/slicer-wasm/fixtures/cube.stl --config packages/slicer-wasm/fixtures/config.json
      - name: Bridge smoke — binary-buffer contract (M2 deferred verification)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: node packages/slicer-wasm/harness/bridge-smoke.mjs packages/slicer-wasm/out/orca_slice.js packages/slicer-wasm/fixtures/cube.stl
      - name: Arrangement — atomic history, cancellation, concurrent slicing
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: node packages/slicer-wasm/harness/arrangement-smoke.mjs packages/slicer-wasm/out/orca_slice.js
      - name: Verify production artifacts and stage the legacy threaded copy
        run: |
          for extension in js wasm data; do
            artifact="packages/slicer-wasm/out/threaded/orca_slice.$extension"
            test -s "$artifact"
            cp "$artifact" "packages/slicer-wasm/out/orca_slice.$extension"
          done
      - name: Save tested threaded WASM artifacts
        if: success() && steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: packages/slicer-wasm/out/threaded
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}
      - name: Upload the legacy threaded WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: orca-slice
          path: |
            packages/slicer-wasm/out/orca_slice.js
            packages/slicer-wasm/out/orca_slice.wasm
            packages/slicer-wasm/out/orca_slice.data
          retention-days: 7
      - name: Upload threaded Web WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: orca-slice-threaded
          path: packages/slicer-wasm/out/threaded
          if-no-files-found: error
          retention-days: 7

  wasm_serial:
    name: WASM serial build + smoke
    needs: [wasm_deps, profile-pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # version header reads `git describe` on the submodule
      - name: Restore tested serial WASM artifacts
        id: wasm-cache
        uses: actions/cache/restore@v6
        with:
          path: packages/slicer-wasm/out/serial
          key: ${{ needs.wasm_deps.outputs.build_cache_key }}-serial
      - uses: actions/setup-node@v7
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          name: profile-packages
          path: packages/profile-resources/dist
      - uses: emscripten-core/setup-emsdk@v15
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Restore compiled WASM dependencies
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        id: dependency-cache
        uses: actions/cache/restore@v6
        with:
          path: packages/slicer-wasm/.work/deps
          key: ${{ needs.wasm_deps.outputs.cache_key }}
      - name: Require the compiled dependency cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: test "${{ steps.dependency-cache.outputs.cache-hit }}" = "true"
      - name: Refresh generated dependency headers
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: bash packages/slicer-wasm/fetch-deps.sh
      - name: Build serial WASM for the Web fallback
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: WASM_THREADING=0 WASM_ARTIFACT_VARIANT=serial bash packages/slicer-wasm/build.sh
      - name: Verify arrangement with cached serial NLopt
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          cmake --build packages/slicer-wasm/.work/serial/build --target arrangement_core_test headless_arrangement_test --parallel 2
          node packages/slicer-wasm/.work/serial/build/arrangement_core_test.cjs
          node packages/slicer-wasm/.work/serial/build/headless_arrangement_test.cjs
      - name: Arrangement — serial atomic history and partial success
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: node packages/slicer-wasm/harness/arrangement-smoke.mjs packages/slicer-wasm/out/serial/orca_slice.js
      - name: Smoke — serial fallback slices cube.stl
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: node packages/slicer-wasm/harness/run-slice.mjs --module packages/slicer-wasm/out/serial/orca_slice.js --stl packages/slicer-wasm/fixtures/cube.stl --config packages/slicer-wasm/fixtures/config.json
      - uses: pnpm/action-setup@v6
        if: steps.wasm-cache.outputs.cache-hit != 'true'
      - name: Install native profile-fixture packaging dependencies
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --filter @orca/profile-resources
      - name: Printer picker — exact toolhead combinations and indexed fallback
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: node packages/slicer-wasm/harness/printer-picker-smoke.mjs packages/slicer-wasm/out/serial/orca_slice.js
      - name: Arrangement — explicit test build verifies publication rollback
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S packages/slicer-wasm -B packages/slicer-wasm/.work/serial/build -DNEO_ARRANGEMENT_TEST=ON
          cmake --build packages/slicer-wasm/.work/serial/build --target orca_slice --parallel 2
          node packages/slicer-wasm/harness/arrangement-smoke.mjs packages/slicer-wasm/.work/serial/build/orca_slice.js --test-injection
          # Keep the enabled test artifact in the build tree. Upload only the
          # production out/serial artifact already checked by its smoke above.
      - name: Verify production serial artifacts
        run: |
          for extension in js wasm data; do
            test -s "packages/slicer-wasm/out/serial/orca_slice.$extension"
          done
      - name: Save tested serial WASM artifacts
        if: success() && steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: packages/slicer-wasm/out/serial
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}
      - name: Upload serial Web WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: orca-slice-serial
          path: packages/slicer-wasm/out/serial
          if-no-files-found: error
          retention-days: 7

  unit:
    name: Unit + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6 # installs pnpm@10.0.0 from root packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - run: pnpm -r typecheck

  e2e-mock:
    name: e2e (mock module)
    needs: [profile-pack]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6 # installs pnpm@10.0.0 from root packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: profile-packages
          path: packages/profile-resources/dist
      - name: e2e — full v1 flow (mock-built app)
        run: pnpm --filter @orca/desktop test:e2e
      - name: Upload mock e2e failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-mock-failures
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Temporary evidence gathering for PR #105; remove after diagnosing the
  # intermittent Windows favorite-promotion failure.
  e2e-color-diagnostic:
    name: Windows favorite diagnostics (temporary)
    if: github.head_ref == 'dev/fix-gradient-favorite-ci'
    needs: [profile-pack]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: profile-packages
          path: packages/profile-resources/dist
      - name: Repeat favorite journey with renderer traces
        run: pnpm --filter @orca/desktop test:e2e --grep "color drafts commit once" --repeat-each=10
      - name: Upload favorite diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-favorite-diagnostics
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-real:
    name: e2e (real module)
    needs: [wasm_threaded, wasm_serial, profile-pack]
    runs-on: ubuntu-latest
    env:
      CI: "true"
      ORCA_E2E_REAL: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6 # installs pnpm@10.0.0 from root packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: orca-slice-threaded
          path: packages/slicer-wasm/out/threaded
      - uses: actions/download-artifact@v8
        with:
          name: orca-slice-serial
          path: packages/slicer-wasm/out/serial
      - uses: actions/download-artifact@v8
        with:
          name: profile-packages
          path: packages/profile-resources/dist
      - run: node scripts/stage.mjs
      - name: e2e — full v1 flow (real module, asserts G1 moves in exported gcode)
        run: xvfb-run -a pnpm --filter @orca/desktop test:e2e:real
      - name: Upload real e2e failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-real-failures
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  pages-build:
    name: Build Web Pages
    needs: [wasm_threaded, wasm_serial]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: orca-slice-threaded
          path: packages/slicer-wasm/out/threaded
      - uses: actions/download-artifact@v8
        with:
          name: orca-slice-serial
          path: packages/slicer-wasm/out/serial
      - uses: actions/download-artifact@v8
        with:
          name: profile-packages
          path: packages/profile-resources/dist
      - uses: actions/configure-pages@v5
      - name: Verify Web host
        run: |
          pnpm --filter @orca/web test
          pnpm --filter @orca/web typecheck
      - name: Build static Web app
        run: pnpm --filter @orca/web build
      - name: Verify subpath deployment
        run: node apps/web/scripts/non-root-smoke.mjs
      - name: Prepare Pages artifact
        run: node scripts/prepare-web-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  pages-deploy:
    name: Deploy Web Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  package:
    name: Package (${{ matrix.id }})
    needs: [wasm_threaded, wasm_serial, profile-pack]
    env:
      ORCA_E2E_REAL: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win-x64-nsis
            os: windows-latest
            arch: x64
            args: --win --x64
            suffix: -win-x64.exe
            unpacked: release/win-unpacked
          - id: win-arm64-nsis
            os: windows-11-arm
            arch: arm64
            args: --win --arm64
            suffix: -win-arm64.exe
            unpacked: release/win-arm64-unpacked
          - id: linux-x64-appimage
            os: ubuntu-latest
            arch: x64
            args: --linux --x64
            suffix: -linux-x86_64.AppImage
            unpacked: release/linux-unpacked
          - id: linux-arm64-appimage
            os: ubuntu-24.04-arm
            arch: arm64
            args: --linux --arm64
            suffix: -linux-arm64.AppImage
            unpacked: release/linux-arm64-unpacked
          - id: mac-x64-dmg
            os: macos-15-intel
            arch: x64
            args: --mac --x64
            suffix: -mac-x64.dmg
            unpacked: release/mac/OrcaSlicerNeo.app
          - id: mac-arm64-dmg
            os: macos-14
            arch: arm64
            args: --mac --arm64
            suffix: -mac-arm64.dmg
            unpacked: release/mac-arm64/OrcaSlicerNeo.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6 # installs pnpm@10.0.0 from root packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: orca-slice-threaded
          path: packages/slicer-wasm/out/threaded
      - uses: actions/download-artifact@v8
        with:
          name: orca-slice-serial
          path: packages/slicer-wasm/out/serial
      - uses: actions/download-artifact@v8
        with:
          name: profile-packages
          path: packages/profile-resources/dist
      - run: node scripts/stage.mjs
      - name: electron-builder (${{ matrix.id }})
        run: pnpm --filter @orca/desktop package ${{ matrix.args }}
      - name: Verify one installer for this architecture
        run: node scripts/verify-installer.mjs '${{ matrix.suffix }}'
      - name: Linux packaged-probe system dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @orca/desktop exec playwright install-deps chromium
      - name: Packaged native provider and login-window seams
        if: runner.os != 'Linux'
        env:
          ORCA_E2E_PACKAGED_ROOT: ${{ matrix.unpacked }}
        run: pnpm --filter @orca/desktop exec playwright test e2e/bambu-packaged.e2e.ts e2e/bambu-account.e2e.ts
      - name: Packaged native provider and login-window seams (Linux)
        if: runner.os == 'Linux'
        env:
          ORCA_E2E_PACKAGED_ROOT: ${{ matrix.unpacked }}
        run: xvfb-run -a pnpm --filter @orca/desktop exec playwright test e2e/bambu-packaged.e2e.ts e2e/bambu-account.e2e.ts
      - name: Upload packaged probe failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-bambu-failures-${{ matrix.id }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.id }}
          path: apps/desktop/release/*${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 14
