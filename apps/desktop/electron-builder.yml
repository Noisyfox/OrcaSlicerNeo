# apps/desktop/electron-builder.yml — M3 packaging (design §Packaging).
# All six targets ship the same generated WASM/profile assets. The beforePack
# hook builds the host addon and acquires the pinned target plugin. CI uses
# matching native runners. Unsigned v1 (macOS signing deferred).
appId: com.orcaslicerne.neo
productName: OrcaSlicerNeo
directories:
  output: release
files:
  - out/**
  - "!out/**/*.map"
  # Web fallbacks must never enter Electron installers, including stale output.
  - "!out/renderer/wasm/serial/**"
  - "!out/renderer/wasm/wasm32/**"
  # Local camera probes write fixture media, reports and certificates under out.
  - "!out/camera-prototype/**"
  # JavaScript dependencies are bundled; native binaries are extraResources.
  # Without this exclusion electron-builder copies workspace source and .work
  # dependency builds through production node_modules into every installer.
  - "!**/node_modules/**"
beforePack: ./scripts/prepare-bambu.cjs
extraResources:
  - from: ../../packages/bambu-native/out/runtime
    to: bambu
# The .data preload bundle is ~70 MB and read on app start; unpacking skips
# asar decompression. (Main serves out/renderer over http; its fs reads are
# asar-aware either way — unpacking is a load-time win, not a requirement.)
asarUnpack:
  # The preview Node Worker and any shared output chunks use normal Node file IO.
  - out/main/**
  - out/renderer/wasm/**
  # Profile ZIPs are runtime inputs fetched by the shared Worker. Keep the
  # complete package tree outside asar so packaged failure probes (and support
  # tooling) can distinguish a missing/corrupt core from an asar read issue.
  - out/renderer/profiles/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
  artifactName: OrcaSlicerNeo-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: OrcaSlicerNeo
  license: AGPL-3.0.txt # AGPL-3.0 text shown on the NSIS license page (copy of root LICENSE in build/)
linux:
  target:
    - target: AppImage
  executableName: OrcaSlicerNeo
  category: Utility
  artifactName: OrcaSlicerNeo-${version}-${os}-${arch}.${ext}
mac:
  icon: build/icon.icns
  target:
    - target: dmg
  category: public.app-category.graphics-design
  identity: null # unsigned v1 (design: "macOS signing deferred")
  artifactName: OrcaSlicerNeo-${version}-${os}-${arch}.${ext}
npmRebuild: false # beforePack builds the Node-API addon explicitly, outside node_modules
publish: null
